name: Extrair projeto
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar o zip na raiz
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -q -o "$ZIP" -d /tmp/extrair
          SRC=$(dirname "$(find /tmp/extrair -name netlify.toml | head -n 1)")
          cp -r "$SRC"/. .
          git rm -q "$ZIP"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Projeto extraído de $ZIP"
          git push
